name: CI
# PRs only: main is updated solely by merging green PRs (and the release
# bot's version bump), so re-running the suite on push is redundant.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
# A newer push to the same PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # `undici` (a direct dependency, ^8.11.2 as of the Cloudflare
          # Worker LLM provider support) declares an engines requirement of
          # node >=22.19.0. Under Node 20, requiring it (indirectly, via
          # anything that touches its Cache/fetch internals) throws
          # `TypeError: webidl.util.markAsUncloneable is not a function`
          # instead of just an EBADENGINE warning - which was crashing
          # whichever vitest worker hit it first and cascading into "0 test"
          # failures across the rest of that worker's queue. Node 20 was
          # already below what a fresh dependency needs; bump to match.
          node-version: '22.19.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        # The dual-entry build's DTS pass (worker + executor entries) exceeds
        # the default heap.
        env:
          NODE_OPTIONS: --max-old-space-size=12288
      # API surface gate: every exports entry has a checked-in api/*.api.md
      # report; a public-API change fails here until `npm run api:update` is run
      # and the diff committed. Runs only here so the report reflects the default peers, not the compat job's ai/zod pairing.
      - run: npm run api:check
      - run: npm run build --workspace=packages/create-lousho
      - run: npm run typecheck --workspace=packages/workspaces-react
      - run: npm run build --workspace=packages/workspaces-react
      # Every ```ts block in README.md and docs/*.md must type-check against
      # src/ (quick-start also runs against the packed tarball). Needs dist/.
      - run: npm run docs:verify-snippets -- --skip-build
      # Compile-time API tests (*.test-d.ts): inference of defineTool, flow types, fs adapter.
      - run: npm run test:types
      # llms.txt / llms-full.txt are generated from README + docs; fail if stale.
      - run: npm run docs:llms:check
      # registry/dist is generated from registry/; fail if stale.
      - run: npm run registry:check
      # schemas/ is generated from the workspace contracts; fail if stale.
      - run: npm run workspaces:schema:check
      # Agent Forge typechecks moved to the dedicated `studio` job (W15a).
  zod4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
      - run: npm ci
      - run: npm install --no-save zod@4
      - run: npx tsc --noEmit
      - run: npm run typecheck:tests
  # lousho-studio (apps/agent-forge): its own package since W13. Builds the SDK first (Studio depends on it through
  # file:../.. in the monorepo), then Studio's checks, then packs both and smoke-tests the install.
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=12288
      - run: npm run typecheck --workspace apps/agent-forge
      - run: npm run typecheck:server --workspace apps/agent-forge
      # Studio imports only public SDK exports (PLAN §19.7).
      - run: npm run lint:imports --workspace apps/agent-forge
      - run: npm run test --workspace apps/agent-forge -- --run
      - run: npm run test:server --workspace apps/agent-forge
      - run: npm run build:studio
      # Packs the SDK and lousho-studio, dry-run publishes Studio, installs both in a fresh project, and checks
      # that `lousho-studio` and `lousho studio` serve the UI. Never publishes.
      - run: npm run pack-smoke:studio -- --skip-build
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '22.19.0' }
          - { os: ubuntu-latest, node: '24' }
          - { os: windows-latest, node: '22.19.0' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build -- --no-dts
      # packages/create-lousho's own tests execFileSync its bin/cli.js, which needs ITS dist/index.js too.
      - run: npm run build --workspace=packages/create-lousho
      - run: npx vitest run --coverage --config vitest.coverage.config.ts
  # What `npm pack` produces must install and work in a fresh project: builds, packs the SDK and
  # create-lousho, `npm publish --dry-run` (never a real publish), installs the tarballs plus
  # peers in a fresh project, loads every export in ESM and CJS, a mock-model turn, the bin and tsc.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run pack-smoke
        env:
          NODE_OPTIONS: --max-old-space-size=12288
      # Hello-world bundle and tarball unpacked size against scripts/size-budget.json (after pack-smoke's builds).
      - run: npm run size-check
  # The newest peers the ranges accept (`ai` 7, `@ai-sdk/*` 4, `ollama-ai-provider-v2` 4, zod 4), installed
  # on top of the default `ai` 4 / zod 3 install (`--no-save` leaves the lockfile alone; `--save-prod
  # --legacy-peer-deps` because ollama-ai-provider-v2 is an optional peer and the dev install's v1 conflicts
  # with zod 4).
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
      - run: npm ci
      # isolated-vm (optional peer, installed here only) rides the same install so it cannot be
      # reverted by a later one. Pinned to 6.2.0: 7.x requires Node >= 24 and this job runs 22.19.0.
      - run: npm install --no-save --save-prod --legacy-peer-deps ai@7 @ai-sdk/openai@4 @ai-sdk/anthropic@4 ollama-ai-provider-v2@4 zod@4 isolated-vm@6.2.0
      - run: npx tsc --noEmit
      - run: npm run test:types
      # No declarations: the DTS worker runs out of memory on ai 7's types, and the tests do not need them
      # (tsc and test:types above cover the types).
      - run: npm run build -- --no-dts
      - run: npm run build --workspace=packages/create-lousho
      # Runs the real 'isolate' driver (src/sandbox/isolate.test.ts): Node >= 20 needs
      # --no-node-snapshot to load isolated-vm; LOUSHO_ISOLATE_TESTS=1 makes that file fail
      # instead of skip if the module cannot load.
      - run: npx vitest run
        env:
          NODE_OPTIONS: --no-node-snapshot
          LOUSHO_ISOLATE_TESTS: '1'
